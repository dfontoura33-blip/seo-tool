<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SEO Score</title>

  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>SEO Score</h1>

  <input id="url" placeholder="Cole a URL" />
  <input id="keyword" placeholder="Palavras-chave (opcional, separadas por vírgula)" />

  <button onclick="analisar()">Analisar</button>

  <div id="resultado" class="result"></div>

  <script>
  async function analisar() {
    const url = document.getElementById("url").value;
    const keywordInput = document.getElementById("keyword").value.toLowerCase();

    const keywords = keywordInput
      .split(",")
      .map(k => k.trim())
      .filter(k => k);

    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    let score = 0;
    let checks = [];
    let sugestoes = [];
    let keywordAnalise = [];

    // SCORE
    if (data.title) {
      score += 25;
      checks.push("✔️ Title encontrado");
    } else {
      checks.push("❌ Title não encontrado");
    }

    if (data.h1) {
      score += 25;
      checks.push("✔️ H1 encontrado");
    } else {
      checks.push("❌ H1 não encontrado");
    }

    if (data.meta) {
      score += 25;
      checks.push("✔️ Meta description presente");
    } else {
      checks.push("❌ Meta description ausente");
    }

    if (data.length > 300 && data.length < 20000) {
  score += 25;
  checks.push("✔️ Conteúdo com tamanho adequado");
} else if (data.length >= 20000) {
  score += 10;
  checks.push("⚠️ Conteúdo muito grande");
} else {
  checks.push("❌ Conteúdo muito curto");
}

    // KEYWORDS
    if (keywords.length > 0) {
      keywords.forEach(keyword => {
        if (data.title?.toLowerCase().includes(keyword) || data.h1?.toLowerCase().includes(keyword)) {
          keywordAnalise.push(`✔️ "${keyword}" encontrada`);
        } else {
          keywordAnalise.push(`❌ "${keyword}" não encontrada`);
        }
      });
    }

    // NIVEL
    let nivel = "Ruim";
    let cor = "🔴";

    if (score >= 80) {
      nivel = "Excelente";
      cor = "🟢";
    } else if (score >= 50) {
      nivel = "Médio";
      cor = "🟡";
    }

    // OUTPUT
    document.getElementById("resultado").innerHTML = `
      <h2>Score: ${score}/100 - ${cor} ${nivel}</h2>

      <h3>📊 Diagnóstico</h3>
      ${checks.map(c => `<p>${c}</p>`).join("")}

      <hr>

      <h3>🔎 Palavras sugeridas</h3>
      ${data.sugestoes.map(p => `<p>👉 ${p}</p>`).join("")}

      ${
        keywords.length > 0
        ? `
        <hr>
        <h3>🔍 Análise das suas palavras</h3>
        ${keywordAnalise.map(k => `<p>${k}</p>`).join("")}
        `
        : ""
      }

      <hr>

      <p><strong>Title:</strong> ${data.title}</p>
      <p><strong>H1:</strong> ${data.h1}</p>
      <p><strong>Meta:</strong> ${data.meta}</p>
      <p><strong>Tamanho:</strong> ${data.length}</p>
    `;
  }
  </script>

</body>
</html>
