<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SEO Tool</title>

  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 40px auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>SEO Score</h1>

<input id="url" placeholder="Cole a URL aqui" />

<button onclick="analisar()">Analisar</button>

<div id="resultado" class="result"></div>

<script>
async function analisar() {
  const url = document.getElementById("url").value;

  const res = await fetch("/api/analyze", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  document.getElementById("resultado").innerHTML = `
    <h2>Score: ${data.score}/100</h2>

    ${data.checks.map(c => `<p>${c}</p>`).join("")}

    <hr>

    <p><strong>Title:</strong> ${data.title}</p>
    <p><strong>H1:</strong> ${data.h1}</p>
    <p><strong>Meta:</strong> ${data.meta}</p>

    <hr>

    <h3>Palavras principais</h3>
    ${data.keywords.map(k => `<p>👉 ${k}</p>`).join("")}

    <h3>Intenção</h3>
    <p>${data.intent}</p>

    <h3>Sugestões de Title</h3>
    ${data.suggestedTitles.map(t => `<p>✨ ${t}</p>`).join("")}

    <h3>Meta sugerida</h3>
    <p>${data.suggestedMeta}</p>
  `;
}
</script>

</body>
</html>
