<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SEO Tool</title>

<style>
body { font-family: Arial; max-width: 700px; margin: 40px auto; }
input, button { width: 100%; padding: 10px; margin-top: 10px; }
</style>
</head>

<body>

<h1>SEO Analyzer</h1>

<input id="url" placeholder="Cole a URL" />

<button onclick="analisar()">Analisar</button>

<div id="resultado"></div>

<script>
async function analisar() {
  const url = document.getElementById("url").value;

  const response = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });

  const data = await response.json();

  document.getElementById("resultado").innerHTML = `
    
    document.getElementById("resultado").innerHTML = `
<h2>Score: ${data.score}/${data.maxScore}</h2>

<h3>📊 Diagnóstico</h3>
${data.checks.map(c => `<p>${c}</p>`).join("")}

<hr>

<h3>Title:</h3>
<p>${data.title}</p>

<h3>H1:</h3>
<p>${data.h1}</p>

<h3>Meta:</h3>
<p>${data.meta}</p>

<hr>

<h3>🔎 Palavras principais</h3>
${data.topWords.map(w => `<p>👉 ${w}</p>`).join("")}

<hr>

<h3>🧠 Intenção de busca</h3>
<p>${data.intent}</p>

<hr>

<h3>✨ Sugestão de Title</h3>
<p>${data.suggestedTitle}</p>

<h3>✨ Sugestão de Meta Description</h3>
<p>${data.suggestedMeta}</p>
`;

}
</script>

</body>
</html>
