<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SEO Tool</title>

<style>
body { font-family: Arial; max-width: 700px; margin: 40px auto; }
input, button { width: 100%; padding: 10px; margin-top: 10px; }
.error { color: red; }
</style>

</head>

<body>

<h1>SEO Score</h1>

<input id="url" placeholder="Cole a URL" />
<button onclick="analisar()">Analisar</button>

<div id="resultado"></div>

<script>
async function analisar() {
  const url = document.getElementById("url").value;

  const box = document.getElementById("resultado");
  box.innerHTML = "Analisando...";

  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    // 👇 mostra erro da API
    if (data.error) {
      box.innerHTML = `<p class="error">Erro: ${data.error}<br>${data.detalhe || ""}</p>`;
      return;
    }

    box.innerHTML = `
      <h2>Score: ${data.score}/100</h2>

      ${data.checks.map(c => `<p>${c}</p>`).join("")}

      <hr>

      <p><b>Title:</b> ${data.data.title}</p>
      <p><b>H1:</b> ${data.data.h1}</p>
      <p><b>Meta:</b> ${data.data.meta}</p>

      <p><b>H2:</b> ${data.data.h2Count}</p>
      <p><b>H3:</b> ${data.data.h3Count}</p>
      <p><b>Palavras:</b> ${data.data.wordCount}</p>

      <hr>

      <p><b>Intenção:</b> ${data.intent}</p>
      <p><b>Sugestão de H1:</b> ${data.suggestedH1}</p>
    `;

  } catch (err) {
    box.innerHTML = `<p class="error">Erro no front: ${err.message}</p>`;
  }
}
</script>

</body>
</html>
