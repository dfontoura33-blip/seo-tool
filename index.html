<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SEO Score</title>

  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 40px auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>SEO Score</h1>

  <input id="url" placeholder="Cole a URL (https://...)" />
  <input id="keyword" placeholder="Palavra-chave" />

  <button onclick="analisar()">Analisar</button>

  <div id="resultado"></div>

 <script>
async function analisar() {
  const url = document.getElementById("url").value;
  const keyword = document.getElementById("keyword").value;

  const response = await fetch("/api/analyze", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ url, keyword })
  });

  const data = await response.json();

  let score = 0;
  let checks = "";

  // TITLE (20)
  if (data.title) {
    score += 20;
    checks += "✔️ Title encontrado<br>";
  } else {
    checks += "❌ Title não encontrado<br>";
  }

  // H1 (20)
  if (data.h1) {
    score += 20;
    checks += "✔️ H1 encontrado<br>";
  } else {
    checks += "❌ H1 não encontrado<br>";
  }

  // META (15)
  if (data.meta) {
    score += 15;
    checks += "✔️ Meta description presente<br>";
  } else {
    checks += "❌ Meta description ausente<br>";
  }

  // TAMANHO (15)
  if (data.length > 300 && data.length < 50000) {
    score += 15;
    checks += "✔️ Conteúdo com tamanho adequado<br>";
  } else {
    checks += "⚠️ Conteúdo muito curto ou muito grande<br>";
  }

  // KEYWORD TITLE (15)
  if (data.title && keyword && data.title.toLowerCase().includes(keyword.toLowerCase())) {
    score += 15;
    checks += "✔️ Palavra-chave no Title<br>";
  } else {
    checks += "❌ Palavra-chave não está no Title<br>";
  }

  // KEYWORD H1 (15)
  if (data.h1 && keyword && data.h1.toLowerCase().includes(keyword.toLowerCase())) {
    score += 15;
    checks += "✔️ Palavra-chave no H1<br>";
  } else {
    checks += "❌ Palavra-chave não está no H1<br>";
  }

  // NÍVEL
  let nivel = "";
  if (score >= 80) nivel = "🟢 Excelente";
  else if (score >= 50) nivel = "🟡 Médio";
  else nivel = "🔴 Fraco";

  document.getElementById("resultado").innerHTML = `
    <h2>Score: ${score}/100 - ${nivel}</h2>
    ${checks}
    <hr>
    <p><strong>Title:</strong> ${data.title}</p>
    <p><strong>H1:</strong> ${data.h1}</p>
    <p><strong>Meta description:</strong> ${data.meta}</p>
    <p><strong>Tamanho do conteúdo:</strong> ${data.length} caracteres</p>
  `;
}
</script>
