<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SEO Tool</title>

<style>
body { font-family: Arial; max-width: 700px; margin: 40px auto; }
input, button { width: 100%; padding: 10px; margin-top: 10px; }
</style>
</head>

<body>

<h1>SEO Analyzer</h1>

<input id="url" placeholder="Cole a URL" />

<button onclick="analisar()">Analisar</button>

<div id="resultado"></div>

<script>
async function analisar() {
  const url = document.getElementById("url").value;

  const response = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });

  const data = await response.json();

  document.getElementById("resultado").innerHTML = `
    
    <h2>📊 Diagnóstico</h2>

    <p><strong>Title:</strong> ${data.title}</p>
    <p><strong>H1:</strong> ${data.h1}</p>
    <p><strong>Meta:</strong> ${data.meta}</p>

    <hr>

    <h2>🔎 Palavras principais</h2>
    ${data.topWords.map(w => `<p>👉 ${w}</p>`).join("")}

    <hr>

    <h2>🧠 Intenção de busca</h2>
    <p>${data.intent}</p>

    <hr>

    <h2>✨ Sugestão de Title</h2>
    <p>${data.suggestedTitle}</p>

    <h2>✨ Sugestão de Meta Description</h2>
    <p>${data.suggestedMeta}</p>

  `;
}
</script>

</body>
</html>
